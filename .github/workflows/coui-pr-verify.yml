name: Verify COUI migration PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'design/**'
      - 'app/**'
      - 'service/**'
      - 'gradle/**'
      - '.github/workflows/coui-pr-verify.yml'
      - '.github/workflows/mainline-release.yaml'
      - '.github/scripts/prepare_geoassets.py'

permissions:
  contents: read

concurrency:
  group: coui-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'astarion1965974/ClashMetaForAndroid'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android SDK and NDK
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 -c 'print("y\n" * 200)' > "$RUNNER_TEMP/licenses.txt"
          "$manager" --licenses < "$RUNNER_TEMP/licenses.txt" > /dev/null
          "$manager" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          custom.application.id=com.astarion.clash.live
          custom.application.name=Clash Meta Live
          remove.suffix=true
          EOF
      # PR verification is UI/JVM scoped. The signed mainline Release workflow
      # independently runs all native Go routing, mobile and DNS tests.
      # Avoid repeated 504 failures from MetaCubeX's external Go release CDN
      # for UI-only commits; keep the offline GeoData integrity test here.
      - name: Offline GeoData cache integrity regression tests
        run: python3 .github/scripts/prepare_geoassets.py --self-test
      - name: Compile and run UI, service and app JVM tests
        run: |
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            :design:testAlphaDebugUnitTest :service:testAlphaDebugUnitTest :app:testAlphaDebugUnitTest \
            -Pcmfa.abis=arm64-v8a --stacktrace
      - name: Print failed JVM test assertions
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in Path('.').glob('**/build/test-results/**/TEST-*.xml'):
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError):
                  continue
              for case in root.findall('.//testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(f'{path}: {case.get("classname")}.{case.get("name")}')
                      print((failure.get('message') or '')[:2500])
                      print((failure.text or '')[:3500])
          PY
      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-pr-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            design/build/ui-previews/
          if-no-files-found: ignore
