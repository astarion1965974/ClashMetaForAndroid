name: Build COUI APK

on:
  push:
    branches:
      - 'feat/coui-cloud'
    tags:
      - 'coui-r*'

permissions:
  contents: read

concurrency:
  group: coui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'astarion1965974/ClashMetaForAndroid'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 -c 'print("y\n" * 200)' > "$RUNNER_TEMP/android-licenses.txt"
          "$sdkmanager" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          custom.application.id=com.astarion.clash.live.coui.cloud
          custom.application.name=Clash Meta COUI Cloud
          remove.suffix=true
          EOF
      - name: Install patched Go toolchain
        run: |
          curl --fail --location --retry 3 https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmfa-go"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/cmfa-go"
          go_root="$RUNNER_TEMP/cmfa-go/go"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"
          echo "$go_root/bin" >> "$GITHUB_PATH"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch -d "$go_root" --forward -p 1 -i "$patch_file"
          done
      - name: Test native routing and DNS
        working-directory: core/src/main/golang
        run: |
          overlay=$(python3 "$GITHUB_WORKSPACE/.github/scripts/mobile_core_overlay.py")
          GOFLAGS="-overlay=$overlay" go test ./native/routing ./native/mobile -count=1
      - name: Build and verify ARM64 APK
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^coui-r([1-9][0-9]{0,6})(\.[1-9][0-9]*)?$ ]]
            revision="${BASH_REMATCH[1]}"
          else
            revision=6
          fi
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            design:testAlphaDebugUnitTest service:testAlphaDebugUnitTest app:testAlphaDebugUnitTest \
            app:assembleAlphaDebug -Pcmfa.abis=arm64-v8a "-Pcmfa.couiRevision=$revision"
          mkdir release
          apk=release/ClashMeta-COUI-arm64-debug.apk
          cp app/build/outputs/apk/alpha/debug/*-arm64-v8a-*.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/coui-badging.txt"
          grep -F "package: name='com.astarion.clash.live.coui.cloud' versionCode='$((211042 + revision))' versionName='2.11.36.Live.Mobile.1-COUI.$revision'" "$RUNNER_TEMP/coui-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/coui-badging.txt"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-arm64
          path: release/
          if-no-files-found: error
      - name: Retain failed test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coui-arm64
          path: release
      - name: Publish pre-release with the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          if assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            if [[ -z "$assets" ]]; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release/*
            elif grep -Fxq ClashMeta-COUI-arm64-debug.apk <<< "$assets" && grep -Fxq SHA256SUMS.txt <<< "$assets"; then
              echo 'The verified APK and checksum were already published for this tag.'
            else
              echo '::error::The existing release has an incomplete set of assets. Check it before retrying.'
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "Clash Meta COUI ${GITHUB_REF_NAME#coui-} (Cloud)" \
              --notes 'GitHub Actions 编译的 ARM64 调试测试包。云端测试版采用独立包名，可与本地 COUI R4 并存。' release/*
          fi
