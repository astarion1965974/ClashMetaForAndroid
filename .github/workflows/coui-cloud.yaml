name: Build COUI R8 APK

# Single R8 entry point. No workflow_run or tag triggers.
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/coui-cloud'

permissions:
  contents: read

concurrency:
  group: coui-r8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'astarion1965974/ClashMetaForAndroid' && github.ref == 'refs/heads/feat/coui-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Pin COUI R8 identity
        run: |
          echo "COUI_REVISION=8" >> "$GITHUB_ENV"
          echo "COUI_APPLICATION_ID=com.astarion.clash.live.coui.cloud.r8" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 -c 'print("y\n" * 200)' > "$RUNNER_TEMP/android-licenses.txt"
          "$sdkmanager" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          custom.application.id=$COUI_APPLICATION_ID
          custom.application.name=Clash Meta COUI R$COUI_REVISION
          remove.suffix=true
          EOF
      - name: Install patched Go toolchain
        run: |
          curl --fail --location --retry 3 https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmfa-go"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/cmfa-go"
          go_root="$RUNNER_TEMP/cmfa-go/go"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"
          echo "$go_root/bin" >> "$GITHUB_PATH"
          for patch_file in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch -d "$go_root" --forward -p 1 -i "$patch_file"
          done
      - name: Build and verify ARM64 APK
        run: |
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            design:testAlphaDebugUnitTest \
            --tests 'com.github.kr328.clash.design.CouiPreferenceTest.*' \
            --tests 'com.github.kr328.clash.design.LiveUiTest.dashboardShowsQuotaAndRealDnsResults' \
            --tests 'com.github.kr328.clash.design.LiveUiTest.appRoutingPreservesSelectionAndSaveState' \
            --tests 'com.github.kr328.clash.design.LiveUiTest.ruleSettingsInflateInBothThemesAndKeepSaveReachable' \
            app:assembleAlphaDebug -Pcmfa.abis=arm64-v8a "-Pcmfa.couiRevision=$COUI_REVISION"
          mkdir release
          apk=release/ClashMeta-COUI-R8-arm64-debug.apk
          cp app/build/outputs/apk/alpha/debug/*-arm64-v8a-*.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/coui-badging.txt"
          grep -F "package: name='$COUI_APPLICATION_ID' versionCode='211050'" "$RUNNER_TEMP/coui-badging.txt"
          grep -E "versionName='2[.]11[.]36[.]Live[.]Mobile[.]1-COUI[.]8([.]debug)?'" "$RUNNER_TEMP/coui-badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/coui-badging.txt"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-r8-arm64
          path: release/
          if-no-files-found: error
      - name: Retain failed test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-test-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
      - name: Retain UI previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coui-ui-previews-${{ github.run_id }}
          path: design/build/ui-previews/
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/feat/coui-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: coui-r8-arm64
          path: release
      - name: Publish pre-release with the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          release_tag="coui-r8-build-$GITHUB_RUN_NUMBER"
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null); then
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || { echo '::error::Release tag points to another commit.'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$release_tag" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          if assets=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            if [[ -z "$assets" ]]; then
              gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" release/*
            elif grep -Fxq ClashMeta-COUI-R8-arm64-debug.apk <<< "$assets" && grep -Fxq SHA256SUMS.txt <<< "$assets"; then
              echo 'The verified APK and checksum were already published for this tag.'
            else
              echo '::error::The existing release has an incomplete set of assets. Check it before retrying.'
              exit 1
            fi
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "Clash Meta COUI R8 (build $GITHUB_RUN_NUMBER)" \
              --notes 'COUI R8 ARM64 调试测试包；独立包名，可与本地 COUI R4 并存。不同运行的调试签名可能不同，覆盖安装前请先核对签名并备份配置。' release/*
          fi
