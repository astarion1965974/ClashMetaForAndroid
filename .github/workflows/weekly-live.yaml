name: Weekly Live Upstream Build

on:
  schedule:
    - cron: '15 1 * * 1' # Monday 09:15 Asia/Shanghai
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if upstream and the latest published Live version are unchanged
        type: boolean
        default: false
      publish_run_id:
        description: Resume signing/publication using a previously successful build run ID (leave blank normally)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: weekly-live-upstream
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'astarion1965974/ClashMetaForAndroid' && github.ref == 'refs/heads/main' && inputs.publish_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build: ${{ steps.prepare.outputs.build }}
    steps:
      - name: Checkout trusted CI control branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Test CI merge and version handling
        run: python3 control/.github/scripts/test_weekly_live.py
      - name: Checkout customized Live source
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/live-notifications
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check upstream and published build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C source remote add upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git
          git -C source fetch upstream main
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .target_commitish 2>/dev/null || true)"
          echo "LIVE_PUBLISHED_HEAD=$published" >> "$GITHUB_ENV"
      - name: Prepare candidate without changing the Live branch
        id: prepare
        env:
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          args=()
          if [ "$FORCE_BUILD" = "true" ]; then args+=(--force); fi
          python3 control/.github/scripts/weekly_live.py prepare --source source --artifact weekly-artifact "${args[@]}"
      - name: Set up Java
        if: steps.prepare.outputs.build == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        if: steps.prepare.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        if: steps.prepare.outputs.build == 'true'
        run: |
          python3 - <<'PY'
          import os, subprocess
          sdk = os.environ['ANDROID_HOME']
          manager = sdk + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([manager, '--licenses'], input='y\n' * 200, text=True, stdout=subprocess.DEVNULL, check=True)
          subprocess.run([manager, 'platforms;android-36', 'build-tools;35.0.0', 'ndk;29.0.14206865', 'cmake;3.22.1'], check=True)
          PY
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk = os.environ['ANDROID_HOME']
          Path('source/local.properties').write_text(f'sdk.dir={sdk}\ncustom.application.id=com.astarion.clash.live\ncustom.application.name=Clash Meta Live\nremove.suffix=true\n')
          PY
      - name: Install patched project Go toolchain
        if: steps.prepare.outputs.build == 'true'
        run: |
          curl --fail --location --retry 3 https://github.com/MetaCubeX/go/releases/download/build/go1.26.linux-amd64.tar.gz --output "$RUNNER_TEMP/go.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmfa-go"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/cmfa-go"
          echo "GOROOT=$RUNNER_TEMP/cmfa-go/go" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cmfa-go/go/bin" >> "$GITHUB_PATH"
          for patch_file in "$GITHUB_WORKSPACE"/source/.github/patch/*.patch; do
            patch -d "$RUNNER_TEMP/cmfa-go/go" --forward -p 1 -i "$patch_file"
          done
      - name: Native routing regression tests
        if: steps.prepare.outputs.build == 'true'
        working-directory: source/core/src/main/golang
        env:
          GOMAXPROCS: '2'
        run: |
          overlay=$(python3 "$GITHUB_WORKSPACE/source/.github/scripts/mobile_core_overlay.py")
          GOFLAGS="-overlay=$overlay" go test ./native/routing ./native/mobile -count=1 -v
      - name: Test and build customized ARM64 APK
        if: steps.prepare.outputs.build == 'true'
        working-directory: source
        env:
          GOMAXPROCS: '2'
        run: gradle --no-daemon --console=plain --max-workers=2 design:testAlphaReleaseUnitTest service:testAlphaReleaseUnitTest app:assembleAlphaRelease -Pcmfa.abis=arm64-v8a -Pandroid.suppressUnsupportedCompileSdk=36
      - name: Verify and bundle tested candidate
        if: steps.prepare.outputs.build == 'true'
        run: python3 control/.github/scripts/weekly_live.py bundle --source source --artifact weekly-artifact
      - name: Upload build for isolated signing
        if: success() && steps.prepare.outputs.build == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-build-${{ github.run_id }}
          path: weekly-artifact/
          retention-days: 30
          if-no-files-found: error
      - name: Retain conflict and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-diagnostics-${{ github.run_id }}
          path: |
            weekly-artifact/merge-conflicts.txt
            source/service/build/reports/tests/
            source/service/build/test-results/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: build
    if: always() && !cancelled() && github.repository == 'astarion1965974/ClashMetaForAndroid' && github.ref == 'refs/heads/main' && (needs.build.outputs.build == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate build run reference
        env:
          BUILD_RUN_ID: ${{ inputs.publish_run_id || github.run_id }}
        run: |
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Build run ID must contain only digits.'
            exit 1
          fi
      - name: Check Live signing availability
        id: signing
        env:
          LIVE_SIGNING_BACKUP_B64: ${{ secrets.LIVE_SIGNING_BACKUP_B64 }}
        run: |
          if [ -n "$LIVE_SIGNING_BACKUP_B64" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Build succeeded, but LIVE_SIGNING_BACKUP_B64 is missing. No replacement-signed APK or release will be published.'
            echo '编译产物已保留。缺少 Live 签名密钥，因此未更新定制分支、未发布可覆盖安装的 APK。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout trusted CI helpers
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout release target
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/live-notifications
          path: source
          fetch-depth: 0
      - name: Download tested build
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: live-build-${{ inputs.publish_run_id || github.run_id }}
          path: weekly-artifact
          run-id: ${{ inputs.publish_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Set up Java for signing
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install signing tools
        if: steps.signing.outputs.ready == 'true'
        run: |
          python3 - <<'PYSDK'
          import os, subprocess
          manager = os.environ['ANDROID_HOME'] + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([manager, '--licenses'], input='y\n' * 200, text=True, stdout=subprocess.DEVNULL, check=True)
          subprocess.run([manager, 'build-tools;35.0.0'], check=True)
          PYSDK
      - name: Sign and verify existing Live identity
        if: steps.signing.outputs.ready == 'true'
        env:
          LIVE_SIGNING_BACKUP_B64: ${{ secrets.LIVE_SIGNING_BACKUP_B64 }}
        run: python3 control/.github/scripts/weekly_live.py sign --artifact weekly-artifact
      - name: Publish verified release and advance Live branch
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/weekly_live.py publish --source source --artifact weekly-artifact
      - name: Remove temporary signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/live-signing"
