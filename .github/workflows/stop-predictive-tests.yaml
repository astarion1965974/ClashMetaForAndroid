name: Stop superseded predictive tests
on:
  push:
    branches: [ops/stop-predictive-tests]
permissions: {}
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel only the superseded predictive test runs requested by the user
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 41291421555 41291060607 41290614721; do
            gh api --method POST "repos/${{ github.repository }}/actions/runs/$run_id/cancel" || true
          done
