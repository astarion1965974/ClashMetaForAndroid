# 由路由器 Open-Box (sing-box) 分流规则移植的 mihomo 配置模板
# 使用前替换 <SUBSCRIPTION_URL> 和 <CHANGE_ME>；不要把真实订阅地址提交进仓库
mixed-port: 7890
allow-lan: true
mode: rule
ipv6: false
log-level: info
external-controller: 127.0.0.1:9090
secret: <CHANGE_ME>
unified-delay: true
tcp-concurrent: true
geodata-mode: false
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - tcp://223.5.5.5
  - 119.29.29.29
  nameserver:
  - tcp://223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    rule-set:geosite_gfw,geosite_google,geosite_geolocation-!cn,geosite_category-ai-!cn,geosite_openai,geosite_spotify:
    - tcp://1.1.1.1#其他
    - tcp://8.8.8.8#其他
proxy-providers:
  airport:
    type: http
    url: <SUBSCRIPTION_URL>
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      expected-status: 204
    exclude-filter: 家宽
proxy-groups:
- name: 地区-美国
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(美国).*$
- name: 地区-香港
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(香港).*$
- name: 地区-日本
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(日本).*$
- name: 地区-新加坡
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(新加坡).*$
- name: 地区-台湾
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(台湾).*$
- name: 地区-韩国
  type: select
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(韩国).*$
- name: 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  expected-status: 204
  lazy: true
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*.*$
- name: 故障转移-备用
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  expected-status: 204
  lazy: true
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(香港|新加坡|韩国).*$
- name: 故障转移-主用
  type: url-test
  use:
  - airport
  filter: ^(?!.*(家宽|剩余|到期|官网|套餐|流量)).*(日本).*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  expected-status: 204
  lazy: true
- name: 故障转移
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  max-failed-times: 2
  expected-status: 204
  lazy: false
  proxies:
  - 故障转移-主用
  - 故障转移-备用
- name: 非日本节点-备用
